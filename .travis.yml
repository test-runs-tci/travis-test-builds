language: shell
os: linux
dist: jammy

before_install:
  # Remove phpenv
  - rmdir ~/.phpenv/shims || true
  - export PATH="/usr/bin:$PATH"
  # Remove if composer exists
  - if [ -f /usr/bin/composer ]; then sudo rm -f /usr/bin/composer; fi
  - if [ -f /usr/local/bin/composer ]; then sudo rm -f /usr/local/bin/composer; fi
  # Install PVM and use PVM to install php 8.3
  - curl -o- https://raw.githubusercontent.com/ArdaGnsrn/pvm-ubuntu/master/install.sh | sudo bash
  - pvm install 8.3
  - pvm use 8.3

  # Install Composer for PHP 8.3
  - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
  - sudo php composer-setup.php --install-dir=/usr/local/bin --filename=composer
  - rm composer-setup.php

  # Verify composer is running with PHP 8.3
  - which composer
  - composer --version

script:
  - sleep 10
