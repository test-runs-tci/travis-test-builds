---
language: ruby
os:
- linux
dist: focal
rvm:
- 3.3.5
services:
- mongodb
install: skip
script:
- until curl --silent -XGET --fail http://localhost:9200/_cluster/health?pretty; do printf '...\n'; sleep 2; done

jobs:
  include:
    - name: "AS-IS: Xenial"
      dist: xenial
      before_install:
        - sudo rm -rf /var/lib/elasticsearch
        - curl https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-7.17.28-amd64.deb -o elasticsearch.deb
        - sudo dpkg -i --force-confnew elasticsearch.deb
        - sudo chown -R elasticsearch:elasticsearch /etc/default/elasticsearch
        - sudo service elasticsearch start
    - name: "ADD_SLEEP_30: Xenial"
      dist: xenial
      before_install:
        - sudo rm -rf /var/lib/elasticsearch
        - curl https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-7.17.28-amd64.deb -o elasticsearch.deb
        - sudo dpkg -i --force-confnew elasticsearch.deb
        - sudo chown -R elasticsearch:elasticsearch /etc/default/elasticsearch
        - sudo service elasticsearch start
        - sleep 30
    - name: "ADD_WORKAROUND: Xenial"
      dist: xenial
      before_install:
        - sudo rm -rf /var/lib/elasticsearch
        - curl https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-7.17.28-amd64.deb -o elasticsearch.deb
        - sudo dpkg -i --force-confnew elasticsearch.deb
        - sudo chown -R elasticsearch:elasticsearch /etc/default/elasticsearch
        - 'sudo sed -i "s/enabled: true/enabled: false/g" /etc/elasticsearch/elasticsearch.yml'
        - sudo service elasticsearch start
        - sleep 30
        - until curl --silent -XGET --fail http://localhost:9200/_cluster/health?pretty; do printf '...\n'; sleep 2; done
