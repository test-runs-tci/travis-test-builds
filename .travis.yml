dist: xenial
language: java
os: linux
jdk:
  - openjdk17
git:
  depth: 3
services:
  - postgresql
addons:
  postgresql: '9.5'
before_script:
  - psql -c 'create database frameworkeventstore;' -U postgres
  - psql --version
install: skip
script: sleep 2
after_success: "${PWD}/target/travis-settings/java/after_success.sh"
env:
  global:
    - JAVA_TOOL_OPTIONS=-Dhttps.protocols=TLSv1.2,TLSv1,TLSv1.1
    - PGPORT=5432
