language: shell
dist: jammy

services:
  - elasticserach

install: skip
script: true

jobs:
  include:
    - name: "default travis config for elasticsearch"
      dist: "bionic"
      before_install:
        - sudo systemctl restart elasticsearch
        - sleep 30
        - until curl --silent -XGET --fail http://localhost:9200/_cluster/health?pretty; do printf '...\n'; sleep 2; done
    - name: "default travis config for elasticsearch"
      dist: "focal"
      before_install:
        - sudo systemctl restart elasticsearch
        - sleep 30
        - until curl --silent -XGET --fail http://localhost:9200/_cluster/health?pretty; do printf '...\n'; sleep 2; done
    - name: "default travis config for elasticsearch"
      dist: "jammy"
      before_install:
        - sudo systemctl restart elasticsearch
        - sleep 30
        - until curl --silent -XGET --fail http://localhost:9200/_cluster/health?pretty; do printf '...\n'; sleep 2; done
    - name: "SSL turned off in travis config for elasticsearch"
      dist: "bionic"
      before_install:
        - 'sudo sed -i "s/enabled: true/enabled: false/g" /etc/elasticsearch/elasticsearch.yml'
        - sudo systemctl restart elasticsearch
        - sleep 30
        - until curl --silent -XGET --fail http://localhost:9200/_cluster/health?pretty; do printf '...\n'; sleep 2; done
    - name: "SSL turned off in travis config for elasticsearch"
      dist: "focal"
      before_install:
        - 'sudo sed -i "s/enabled: true/enabled: false/g" /etc/elasticsearch/elasticsearch.yml'
        - sudo systemctl restart elasticsearch
        - sleep 30
        - until curl --silent -XGET --fail http://localhost:9200/_cluster/health?pretty; do printf '...\n'; sleep 2; done
    - name: "SSL turned off in travis config for elasticsearch"
      dist: "jammy"
      before_install:
        - 'sudo sed -i "s/enabled: true/enabled: false/g" /etc/elasticsearch/elasticsearch.yml'
        - sudo systemctl restart elasticsearch
        - sleep 30
        - until curl --silent -XGET --fail http://localhost:9200/_cluster/health?pretty; do printf '...\n'; sleep 2; done
