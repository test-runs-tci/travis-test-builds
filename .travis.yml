language: shell
os: linux
dist: jammy

before_install:
  # Remove phpenv
  - rmdir ~/.phpenv/shims || true
  - export PATH="/usr/bin:$PATH"
  # Remove if composer exists
  - if [ -f /usr/bin/composer ]; then sudo rm -f /usr/bin/composer; fi
  - if [ -f /usr/local/bin/composer ]; then sudo rm -f /usr/local/bin/composer; fi
  # Install PVM and use PVM to install php 8.3
  - curl -o- https://raw.githubusercontent.com/ArdaGnsrn/pvm-ubuntu/master/install.sh | sudo bash
  - pvm install 8.3
  - pvm use 8.3

  # Install Composer for PHP 8.3
  - EXPECTED_SIGNATURE="$(wget -q -O - https://composer.github.io/installer.sig)"
  - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
  - ACTUAL_SIGNATURE="$(php -r "echo hash_file('sha384', 'composer-setup.php');")"
  - if [ "$EXPECTED_SIGNATURE" != "$ACTUAL_SIGNATURE" ]; then echo 'ERROR: Invalid installer signature'; exit 1; fi
  - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
  - rm composer-setup.php

  # Verify composer is running with php8.3
  - which composer
  - composer --version

script:
  - sleep 10
