os: linux
dist: focal
language: shell

jobs:
  include:
    - name: "Focal - Add File To Workspace"
      dist: focal
      script:
        - docker build -t test:1.2.3 .
        - docker save --output test.tar test:1.2.3
      workspaces:
        create:
          name: docker_image_focal
          paths:
            - test.tar
    - name: "Focal - Use File From Workspace"
      dist: jammy
      script:
        - docker images
        - docker load -i test.tar
        - docker images
      workspaces:
        use: docker_image_focal
    - name: "Jammy - Add File To Workspace"
      dist: jammy
      script:
        - docker build -t test:1.2.3 .
        - docker save --output test.tar test:1.2.3
      workspaces:
        create:
          name: docker_image_jammy
          paths:
            - test.tar
    - name: "Jammy - Use File From Workspace"
      dist: jammy
      script:
        - docker images
        - docker load -i test.tar
        - docker images
      workspaces:
        use: docker_image_jammy
      
