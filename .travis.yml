language: shell
os: linux
dist: jammy

before_install:
  - curl -o- https://raw.githubusercontent.com/ArdaGnsrn/pvm-ubuntu/master/install.sh | sudo bash
  - pvm list
  - pvm install 8.3
  - pvm use 8.3

script:
  - php -v
  - which php
  - php8.3 -v
  - which php8.3

  - sudo update-alternatives --install /usr/bin/php php /usr/bin/php8.3 80
  - sudo update-alternatives --set php /usr/bin/php8.3
  - php -v
  - which php
