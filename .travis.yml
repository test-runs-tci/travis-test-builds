language: php
php: '8.3'
dist: focal

install: skip
script:
  - sleep 2
jobs:
  include:
    - deploy:
        provider: s3
        bucket: $S3_BUCKET
        access_key_id: $AWS_ACCESS_KEY_ID
        secret_access_key: $AWS_SECRET_ACCESS_KEY
        local_dir: test_dir
        upload_dir: test/${TRAVIS_BRANCH}
        region: $AWS_DEFAULT_REGION
        storage_class: STANDARD_IA
        edge: true
        on:
          all_branches: true
