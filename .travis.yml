language: php
php: '8.3'
dist: focal

install: skip
script:
  - sleep 2
jobs:
  include:
    - deploy:
        provider: releases
        token: $GITHUB_TOKEN
        file: README.md
        on:
          all_branches: true
    - deploy:
        provider: releases
        token: $GITHUB_TOKEN
        file: README.md
        edge: true
        on:
          all_branches: true
