language: shell
dist: focal

install: skip
script:
  - echo "Sleeping..." && echo -en "travis_fold:start:sleep\\r"
  - sleep 20
  - echo -en "travis_fold:end:sleep\\r"

  - echo "Kernel Version..." && echo -en "travis_fold:start:kernel-version\\r"
  - uname -r
  - echo -en "travis_fold:end:kernel-version\\r"
